<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEKAO — Drop Bientôt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080808;
      font-family: 'Space Grotesk', sans-serif;
      color: #f0ebe1;
    }

    /* ---- BEHIND: revealed content ---- */
    .behind {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2.2rem;
      z-index: 1;
    }

    .behind-logo {
      width: 80px; height: 80px;
      object-fit: contain;
      filter: invert(1);
      mix-blend-mode: screen;
      opacity: 0.85;
    }

    .brand-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4.5rem, 13vw, 10rem);
      letter-spacing: 0.18em;
      line-height: 1;
      color: #f0ebe1;
    }

    .drop-label {
      font-size: clamp(0.55rem, 1.2vw, 0.72rem);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(240,235,225,0.35);
      margin-top: -1rem;
    }

    .countdown {
      display: flex;
      gap: clamp(1rem, 3.5vw, 3rem);
      align-items: flex-start;
    }

    .unit {
      display: flex; flex-direction: column;
      align-items: center; gap: 0.4rem;
    }

    .unit-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 9vw, 7rem);
      line-height: 1;
      min-width: 2ch;
      text-align: center;
      color: #f0ebe1;
    }

    .unit-label {
      font-size: 0.48rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(240,235,225,0.3);
      font-weight: 300;
    }

    .sep {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      color: rgba(240,235,225,0.15);
      line-height: 1;
      padding-top: 0.05em;
    }

    .notify-form {
      display: flex;
      border: 1px solid rgba(240,235,225,0.18);
    }

    .notify-input {
      background: transparent;
      border: none; outline: none;
      padding: 0.85rem 1.2rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: #f0ebe1;
      width: clamp(160px, 20vw, 220px);
    }

    .notify-input::placeholder {
      color: rgba(240,235,225,0.28);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.58rem;
    }

    .notify-btn {
      background: #f0ebe1;
      border: none;
      padding: 0.85rem 1.4rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #080808;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .notify-btn:hover { background: #d8d3c9; }

    .notify-success {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(240,235,225,0.5);
      display: none;
      text-align: center;
      padding: 0.8rem 0;
    }

    /* ---- FABRIC CANVAS ---- */
    #fabric {
      position: fixed; inset: 0;
      z-index: 10;
      cursor: none;
    }

    #fabric.fading {
      transition: opacity 1.2s ease;
      opacity: 0;
      pointer-events: none;
    }

    /* ---- SCISSORS CURSOR ---- */
    #scissors {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      /* tip of scissors blade is at SVG x=48, y=18 */
      /* we correct for that via JS */
    }

    #scissors svg {
      display: block;
    }

    /* Hint pulse on fabric */
    @keyframes hintPulse {
      0%, 100% { opacity: 0.45; }
      50%  { opacity: 0.2; }
    }
  </style>
</head>

  <script>
    // ---- Countdown ----
    const dropDate = new Date('2026-08-15T12:00:00');
    const pad = n => String(n).padStart(2, '0');

    function updateCountdown() {
      const diff = dropDate - new Date();
      if (diff <= 0) return;
      const s = Math.floor(diff / 1000);
      document.getElementById('days').textContent    = pad(Math.floor(s / 86400));
      document.getElementById('hours').textContent   = pad(Math.floor((s % 86400) / 3600));
      document.getElementById('minutes').textContent = pad(Math.floor((s % 3600) / 60));
      document.getElementById('seconds').textContent = pad(s % 60);
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // ---- Notify ----
    function handleNotify(e) {
      e.preventDefault();
      document.getElementById('notifyForm').style.display = 'none';
      document.getElementById('notifySuccess').style.display = 'block';

    function drawFabric() {
      const w = canvas.width, h = canvas.height;

      // Base fabric fill — dark warm charcoal
      ctx.fillStyle = '#18161380';
      ctx.fillRect(0, 0, w, h);

      // Woven thread lines — horizontal
      ctx.lineWidth = 1;
      for (let y = 0; y < h; y += 4) {
        const alpha = 0.03 + (Math.random() * 0.015);
        ctx.strokeStyle = `rgba(240,235,225,${alpha})`;
        ctx.beginPath();
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(w, y + 0.5);
        ctx.stroke();
      }

      // Woven thread lines — vertical
      for (let x = 0; x < w; x += 4) {
        const alpha = 0.02 + (Math.random() * 0.01);
        ctx.strokeStyle = `rgba(240,235,225,${alpha})`;
        ctx.beginPath();
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, h);
        ctx.stroke();
      }

      // Solid base on top to unify
      const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w,h)*0.75);
      grad.addColorStop(0, '#1e1b17');
      grad.addColorStop(1, '#0d0c0a');
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
      ctx.globalAlpha = 1;

      // Logo on fabric — very faint embossed look
      if (logoImg.complete) {
        const logoSize = Math.min(w, h) * 0.13;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.filter = 'invert(1)';
        ctx.drawImage(logoImg, w/2 - logoSize/2, h/2 - logoSize - 48, logoSize, logoSize);
        ctx.restore();
      }

      // NEKAO text on fabric — subtle
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = '#f0ebe1';
      ctx.font = `normal ${Math.min(Math.floor(w * 0.13), 110)}px 'Bebas Neue', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('NEKAO', w / 2, h / 2 + 20);
      ctx.restore();

      // Hint text
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#f0ebe1';
      ctx.font = "300 11px 'Space Grotesk', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✂   RÉVÉLER', w / 2, h / 2 + 70);
      ctx.restore();
    }

    logoImg.onload = () => drawFabric();
    resize();
    window.addEventListener('resize', resize);

    // ---- Scissors interaction ----
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let angle = 0;
    let totalPixels = 0;
    let revealed = false;

    function positionScissors(x, y) {
      scissors.style.left = (x - TIP_X) + 'px';
      scissors.style.top  = (y - TIP_Y) + 'px';
      scissors.style.transformOrigin = TIP_X + 'px ' + TIP_Y + 'px';
      scissors.style.transform = `rotate(${angle}deg)`;
    }

    function cut(x, y) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.lineWidth = 36;
      ctx.lineCap  = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      [lastX, lastY] = [x, y];

      // Check reveal %
      if (!revealed) checkReveal();
    }

    function checkReveal() {
      const sample = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = sample.data;
      let transparent = 0;
      const step = 20; // sample every 20th pixel for perf
      const total = Math.floor(data.length / (4 * step));
      for (let i = 3; i < data.length; i += 4 * step) {
        if (data[i] < 64) transparent++;
      }
      if (transparent / total > 0.38) {
        revealed = true;
        canvas.classList.add('fading');
        setTimeout(() => canvas.remove(), 1400);
      }
    }

    // Mouse
    canvas.addEventListener('mousedown', e => {
      isDrawing = true;
      [lastX, lastY] = [e.clientX, e.clientY];
    });

    canvas.addEventListener('mousemove', e => {
      const { clientX: x, clientY: y } = e;

      if (isDrawing) {
        const dx = x - lastX, dy = y - lastY;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          angle = Math.atan2(dy, dx) * 180 / Math.PI;
        }
        cut(x, y);
      }

      positionScissors(x, y);
    });

    document.addEventListener('mouseup', () => isDrawing = false);

    canvas.addEventListener('mouseleave', e => {
      positionScissors(e.clientX, e.clientY);
      isDrawing = false;
    });

    // Touch
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      isDrawing = true;
      [lastX, lastY] = [t.clientX, t.clientY];
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!isDrawing) return;
      const t = e.touches[0];
      const { clientX: x, clientY: y } = t;
      cut(x, y);
    }, { passive: false });

    canvas.addEventListener('touchend', () => isDrawing = false);
  </script>
